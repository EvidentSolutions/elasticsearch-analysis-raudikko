# Add a zip built for new ES-version to existing release
name: Add release archive
on:
    workflow_dispatch:
        inputs:
            releaseVersion:
                required: true
                type: string
                description: "Release version to checkout"
            elasticsearchVersion:
                required: true
                type: string
                description: "Version of target Elasticsearch"

jobs:
    # TODO: duplication from build.yaml
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: v${{ github.event.inputs.releaseVersion }}
            - uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  # v0.1.x releases use Gradle 7.5.1, which cannot run on JDK 21+
                  java-version: 17
            - uses: gradle/actions/setup-gradle@v6
            - name: Build with Gradle
              run: ./gradlew build -DbaseVersion=${{ github.event.inputs.releaseVersion }} -DelasticsearchVersion=${{ github.event.inputs.elasticsearchVersion }}
            - name: Upload the artifacts
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload v${{ github.event.inputs.releaseVersion }} build/distributions/*.zip --clobber
